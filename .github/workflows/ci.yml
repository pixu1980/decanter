name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checks
        run: |
          set -o pipefail
          status=0
          for task in typecheck test test:tui; do
            if pnpm "$task" > "$task.log" 2>&1; then
              cat "$task.log"
            else
              status=1
              grep -aE '✖|not ok|Error|expected|fail|throw' "$task.log" | tail -20 | while IFS= read -r line; do
                echo "::error title=$task::$line"
              done
            fi
          done
          exit "$status"
