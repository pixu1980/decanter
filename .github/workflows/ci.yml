name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checks
        run: |
          set -o pipefail
          status=0
          for task in format:check typecheck test test:tui; do
            if pnpm "$task" > "$task.log" 2>&1; then
              cat "$task.log"
            else
              status=1
              grep -aE '✖|not ok|Error|expected|fail|throw' "$task.log" | tail -20 | while IFS= read -r line; do
                echo "::error title=$task::$line"
              done
            fi
          done
          exit "$status"

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate the pull request subjects
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          fail=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            if printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9._-]+\)!?: .+$'; then
              continue
            fi
            echo "::error title=commit message::$subject"
            fail=1
          done < <(git log --format=%s "$base..HEAD")
          exit "$fail"
