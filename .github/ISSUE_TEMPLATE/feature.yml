name: Feature request
description: A store, a behavior or a command you miss
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behavior or the command you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Areas this touches
      options:
        - label: Steam
        - label: GOG
        - label: Epic
        - label: Wine runtime
        - label: CLI
        - label: TUI
        - label: Docs
    validations:
      required: true
